<template>
<lightning-card  variant="Narrow"  title="Account" icon-name="standard:account">
  <template  for:each={accList} for:item="acc" >
     <div key={acc.Id}>
          {acc.Name}
          <br>
          {acc.Industry}
          <br>
          {acc.Phone}
          <hr>
     </div>
  </template>  
  <lightning-datatable
    key-field="id"
    data={accList}
    columns={columnsList}
    >
  </lightning-datatable>
</lightning-card>
</template>
